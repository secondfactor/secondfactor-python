name: publish

# Releases go out only when a maintainer starts this workflow by hand from the
# Actions tab. Pushes, tags and pull requests never publish.
on:
  workflow_dispatch:

# Every job starts with no access at all and is granted only what it needs.
permissions: {}

# Two releases started close together must not race to tag or upload.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Building runs the project's own code and the build backend, so it holds no
  # credential that could publish or write to the repository. What it builds
  # is handed to the next job as an artifact.
  build:
    # Only main is released, so a published version always matches main. The
    # `pypi` environment enforces the same rule on GitHub's side.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          checksum: "6681d691eb7f9c00ac6a3af54252f7ab29ae72f0c8f95bdc7f9d1401c23ea868"
          # A release build never reads a cache that other runs could have written.
          enable-cache: false
      - name: The two version declarations agree
        id: version
        # `__version__` is what the User-Agent header reports, so it must match
        # the version PyPI shows.
        run: |
          project="$(uv version --short)"
          module="$(uv run --locked python -c 'import secondfactor; print(secondfactor.__version__)')"
          echo "pyproject.toml: $project, __version__: $module"
          test "$project" = "$module"
          # The version becomes part of a git ref and a file name, so accept
          # only a plain release number.
          [[ "$project" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$project" >> "$GITHUB_OUTPUT"
      - name: The version has not been tagged before
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "v$VERSION is already tagged; bump the version first." >&2
            exit 1
          fi
      - name: Build
        # uv 0.11.7 builds with its own built-in backend, so nothing is
        # downloaded at build time.
        run: uv build --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job that can publish. It runs no project code: it downloads the
  # built files and hands them to PyPA's official upload action, which also
  # signs PEP 740 attestations so users can verify where the files came from.
  pypi:
    needs: [test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # PyPI trusted publishing accepts this job's OIDC token in place of an API
    # token, and only from this workflow file and this environment. The
    # environment is limited to main and requires a reviewer's approval.
    environment:
      name: pypi
      url: https://pypi.org/project/secondfactor/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Mints the OIDC token PyPI trusted publishing accepts.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true

  # Tagging needs write access to the repository, which no other job holds.
  tag:
    needs: [build, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Creates the release tag.
    steps:
      - name: Tag the release
        # Created through the API, so no checkout or stored credential is
        # needed.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
